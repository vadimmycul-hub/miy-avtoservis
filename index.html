<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17212b"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>Мій автосервіс</title></head><body>
<header><h1>Мій автосервіс</h1><p>Облік автомобілів, замовлень і каси</p></header>
<nav><button data-tab="dashboard" class="active">Огляд</button><button data-tab="cars">Авто</button><button data-tab="orders">Замовлення</button><button data-tab="cash">Каса</button></nav><main>
<section id="dashboard" class="tab active"><div id="stats" class="stats"></div><h2>Останні замовлення</h2><div id="recent"></div></section>
<section id="cars" class="tab"><div class="head"><h2>Автомобілі</h2><button id="addCar">＋ Додати авто</button></div><div id="carList"></div></section>
<section id="orders" class="tab"><div class="head"><h2>Замовлення</h2><button id="addOrder">＋ Нове замовлення</button></div><select id="orderFilter"><option value="all">Усі</option><option value="debt">З боргом</option><option value="paid">Оплачені</option><option value="done">Виконані</option><option value="active">У роботі</option></select><div id="orderList"></div></section>
<section id="cash" class="tab"><div class="cash"><div><small>Залишок у касі</small><strong id="cashBalance">0 ₴</strong></div><button id="addCash">＋ Операція</button></div><div id="cashStats" class="stats"></div><div class="head"><h2>Видача коштів</h2><button id="withdrawCash" class="secondary">Взяти / видати</button></div><h2>Історія каси</h2><div id="cashList"></div></section>
<section id="backup" class="tab"><h2>Резервна копія</h2><button id="export">Зберегти копію</button><label class="file">Відновити з копії<input id="import" type="file" accept="application/json"></label><p class="muted">Регулярно зберігайте резервну копію.</p></section></main><footer><button data-tab="backup">Резервна копія</button></footer>
<dialog id="modal"><form method="dialog" id="editor"><h2 id="modalTitle"></h2><div id="modalBody"></div><div class="actions"><button type="button" id="cancel" class="secondary" onclick="document.getElementById('modal').close()">Скасувати</button><button id="save" type="submit">Зберегти</button></div></form></dialog><div id="toast"></div><script src="app.js"></script></body></html>
